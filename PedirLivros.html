    <main>

    <div class="form-container">
        <h2>Solicitar um Livro</h2>
        <form name="book-request" netlify>
            <div class="form-group">
                <label for="book-title">Título do Livro</label>
                <input type="text" id="book-title" name="book-title" required>
            </div>
            <div class="form-group">
                <label for="author">Autor</label>
                <input type="text" id="author" name="author">
            </div>
            <div class="form-group">
                <label for="details">Detalhes e Sinopse (opcional)</label>
                <textarea id="details" name="details" placeholder="Ex: 'É um livro de ficção científica sobre...' ou 'Não sei o título, mas o autor é...'" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label for="email">Seu Email para contato</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="btns">
                <button type="submit" class="btn-submit">Enviar Pedido</button>
                </button>
            </div>
            <div>

            </div>
        </form>
    </div>

    </main>
