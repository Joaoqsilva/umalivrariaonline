  <script>

    const inputBusca = document.getElementById('buscarLivro');
    const livros = document.querySelectorAll('.livro');

    // Função de busca
    inputBusca.addEventListener('input', function () {
      const termo = this.value.toLowerCase(); // pega o valor digitado em minúsculas

      livros.forEach(livro => {
        const titulo = livro.querySelector('.titulo').textContent.toLowerCase(); // título em minúsculas
        if (titulo.includes(termo)) {
          livro.style.display = ''; // mostra o livro
        } else {
          livro.style.display = 'none'; // esconde o livro
        }
      });
    });


    document.addEventListener('DOMContentLoaded', () => {
      const hamburguerIcon = document.querySelector('.hamburguer-icon');
      const navLinks = document.querySelector('.nav-links');
      const body = document.querySelector('body'); // Seleciona o elemento body

      hamburguerIcon.addEventListener('click', () => {
        // Alterna a classe 'active' no ícone e nos links
        hamburguerIcon.classList.toggle('active');
        navLinks.classList.toggle('active');

        // Alterna a classe 'no-scroll' no body para desabilitar o scroll
        body.classList.toggle('no-scroll');
      });
    });

    // JavaScript para filtro por categoria
    const botoesFiltro = document.querySelectorAll('.botoes-filtro button');

    botoesFiltro.forEach(botao => {
      botao.addEventListener('click', () => {
        const categoriaSelecionada = botao.getAttribute('data-categoria');

        livros.forEach(livro => {
          if (categoriaSelecionada === 'todos') {
            livro.style.display = ''; // Mostra todos os livros
          } else if (livro.classList.contains('categoria-' + categoriaSelecionada)) {
            livro.style.display = ''; // Mostra o livro se ele pertencer à categoria
          } else {
            livro.style.display = 'none'; // Esconde os outros
          }
        });
      });
    });

    const botao = document.getElementById('botao');
    const seta = document.getElementById('seta');
    const filtro = document.getElementById('filtro');

    botao.addEventListener('click', () => {
      seta.classList.toggle('rotate');
      filtro.classList.toggle('ativo');
    });


  </script>
