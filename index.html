    <script>

          },
          
            /*  {

            {

                categorias: ["historia-da-psicologia", "psicologia", "educacao"],

                ligaInstagramUrl: "https://www.instagram.com/lalit_ufsc/",
                ligaWhatsappUrl: "https://wa.me/5511922222222"
            },*/
        ];

        // =========================================================
        // FUNÇÕES DE RENDERIZAÇÃO
        // =========================================================

        /**
         * Cria o HTML de um único card de vídeo.
         * @param {Object} video - Objeto contendo { titulo, categorias, url, palestranteInstagramUrl, ligaInstagramUrl, ligaWhatsappUrl }.
         */
        function adicionarVideoCard(video) {
            const container = document.getElementById('container-videos');
            if (!container) return;

            const cardDiv = document.createElement('div');
            cardDiv.classList.add('card-video');

            // Iframe do vídeo
            const iframe = document.createElement('iframe');
            iframe.src = video.url;
            iframe.setAttribute('allow', 'autoplay; encrypted-media');
            iframe.setAttribute('allowfullscreen', '');
            
            // Container de categorias (tags)
            const categoriasDiv = document.createElement('div');
            categoriasDiv.classList.add('categorias-video');
            
            // Adiciona as tags de categoria
            video.categorias.forEach(categoria => {
                const span = document.createElement('span');
                span.textContent = categoria.toUpperCase().replace(/-/g, ' '); // Formata para exibição
                categoriasDiv.appendChild(span);
            });
            
            // Título
            const tituloH1 = document.createElement('h1');
            tituloH1.classList.add('titulo-video');
            tituloH1.textContent = video.titulo;

            // Wrapper dos Botões (para controle de layout)
            const buttonWrapper = document.createElement('div');
            buttonWrapper.classList.add('card-buttons-wrapper'); 

            // Botão 1: Instagram do Palestrante
            const instagramPalestranteLink = document.createElement('a');
            instagramPalestranteLink.classList.add('instagram-btn');
            instagramPalestranteLink.href = video.palestranteInstagramUrl || "https://www.instagram.com/link_palestrante/"; 
            instagramPalestranteLink.target = "_blank";
            instagramPalestranteLink.innerHTML = '<i class="fab fa-instagram"></i> Siga o(a) Palestrante';

            // Botão 2: Instagram da Liga
            const instagramLigaLink = document.createElement('a');
            instagramLigaLink.classList.add('instagram-btn');
            instagramLigaLink.href = video.ligaInstagramUrl || "https://www.instagram.com/link_liga/"; 
            instagramLigaLink.target = "_blank";
            instagramLigaLink.innerHTML = '<i class="fab fa-instagram"></i> CONHEÇA O INSTA DA LIGA';
            
            // Botão 3: WhatsApp da Liga
            const Wpplink= document.createElement('a');
            Wpplink.classList.add('wpp-btn');
            Wpplink.href = video.ligaWhatsappUrl || "https://wa.me/"; 
            Wpplink.target = "_blank";
            Wpplink.innerHTML = '<i class="fab fa-whatsapp"></i> WHATSAPP DA LIGA';
            
            // Montagem do Wrapper de Botões
            buttonWrapper.appendChild(instagramPalestranteLink);
            buttonWrapper.appendChild(instagramLigaLink);
            buttonWrapper.appendChild(Wpplink); 

            // Montagem do Card (Ordem: Iframe -> Categorias -> Título -> Wrapper de Botões)
            cardDiv.appendChild(iframe);
            cardDiv.appendChild(categoriasDiv);
            cardDiv.appendChild(tituloH1);
            cardDiv.appendChild(buttonWrapper);

            container.appendChild(cardDiv);
        }

        /**
         * Limpa o container e exibe a lista de vídeos fornecida.
         * @param {Array} videosParaExibir - Array de objetos de vídeo a serem mostrados.
         */
        function exibirVideos(videosParaExibir) {
            const container = document.getElementById('container-videos');
            container.innerHTML = ''; // Limpa o conteúdo anterior
            if (videosParaExibir.length === 0) {
                 container.innerHTML = '<h2 style="width:100%; text-align:center; color:#555; margin-top:50px;">Nenhum post foi encontrado. Tente outra busca ou categoria.</h2>';
            } else {
                 videosParaExibir.forEach(video => {
                    adicionarVideoCard(video);
                });
            }
        }

        // =========================================================
        // INICIALIZAÇÃO E LISTENERS
        // =========================================================

        document.addEventListener('DOMContentLoaded', () => {
            // 1. Exibição inicial de todos os vídeos
            exibirVideos(listaDeVideos);

            // 2. Funcionalidade de busca (por TÍTULO)
            const inputBusca = document.getElementById('buscarLivro');
            inputBusca.addEventListener('input', (evento) => {
                const termo = evento.target.value.toLowerCase().trim();
                
                // Filtra a lista de vídeos pelo título
                const videosFiltrados = listaDeVideos.filter(video =>
                    video.titulo.toLowerCase().includes(termo)
                );
                
                exibirVideos(videosFiltrados);
            });

            // 3. Funcionalidade de filtro por categoria
            const botoesFiltro = document.querySelectorAll('.botoes-filtro button');
            botoesFiltro.forEach(botao => {
                botao.addEventListener('click', (evento) => {
                    const categoriaSelecionada = evento.target.getAttribute('data-categoria');
                    let videosFiltrados;
                    
                    if (categoriaSelecionada === 'todos') {
                        videosFiltrados = listaDeVideos;
                    } else {
                        // Filtra vídeos cuja lista de categorias INCLUA a categoria selecionada
                        videosFiltrados = listaDeVideos.filter(video =>
                            video.categorias.includes(categoriaSelecionada)
                        );
                    }
                    
                    // Limpa o campo de busca ao filtrar por categoria
                    inputBusca.value = ''; 
                    exibirVideos(videosFiltrados);
                    
                    // Fecha o menu de filtro após a seleção
                    document.getElementById('filtro').classList.remove('ativo');
                    document.getElementById('seta').classList.remove('rotate');
                });
            });

            // 4. Funcionalidade do botão "CATEGORIAS" (Toggle)
            const botaoFiltro = document.getElementById('botao');
            const seta = document.getElementById('seta');
            const filtro = document.getElementById('filtro');
            botaoFiltro.addEventListener('click', () => {
                seta.classList.toggle('rotate');
                filtro.classList.toggle('ativo');
            });
            
            // 5. Funcionalidade do menu Hamburguer (Mobile)
            const hamburguerIcon = document.querySelector('.hamburguer-icon');
            const navLinks = document.querySelector('.nav-links');
            const body = document.querySelector('body'); 

            hamburguerIcon.addEventListener('click', () => {
                hamburguerIcon.classList.toggle('active');
                navLinks.classList.toggle('active');
                body.classList.toggle('no-scroll');
            });
        });
    </script>
